name: Component regression
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release tag to verify (empty runs source regression)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/test-check-maven.py
          python3 scripts/test-jitpack-metadata.py
          node --test ohos/permission-native/test/permission.test.cjs
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash gradlew :permission-core:testDebugUnitTest :permission-core:compileDebugKotlinAndroid --no-daemon --max-workers=1
      - run: bash gradlew -p verification-kuikly test --no-daemon --max-workers=1
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew :permission-core:compileKotlinIosArm64 :permission-core:compileKotlinIosSimulatorArm64 :permission-core:compileKotlinOhosArm64 :permission-kuikly:compileKotlinOhosArm64 --no-daemon --max-workers=1
  release-android:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash scripts/ci-release.sh
      - run: bash gradlew -p verification-consumer compileDebugKotlinAndroid -PpermissionVersion="$VERSION" --refresh-dependencies --no-daemon --max-workers=1
  release-native:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew -p verification-consumer linkDebugFrameworkIosSimulatorArm64 compileKotlinOhosArm64 -PpermissionVersion="$VERSION" --refresh-dependencies --no-daemon --max-workers=1
